name: Repair static app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/fix-notepad-syntax.py'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair known Notepad syntax issue
        run: python3 scripts/fix-notepad-syntax.py
      - name: Commit repair when needed
        run: |
          if git diff --quiet -- index.html; then
            echo 'No repair needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: repair Notepad JavaScript syntax'
          git push
