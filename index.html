<html lang="cs">
<head>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#008080;font:11px"MS Sans Serif",Arial,sans-serif}
*{box-sizing:border-box}
button,input,textarea{font:11px"MS Sans Serif",Arial,sans-serif}
#boot{position:fixed;inset:0;background:#000080;color:#fff;z-index:99999;display:flex;align-items:center;justify-content:center;font-family:"Courier New",monospace}
#boot.hide{display:none}.bootbox{width:min(560px,92vw);border:2px solid #fff;padding:18px;background:#000080}.brand{display:flex;gap:14px;align-items:center}.logo{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:72px;height:52px}.logo i:nth-child(1){background:red}.logo i:nth-child(2){background:#0f0}.logo i:nth-child(3){background:#00f}.logo i:nth-child(4){background:#ff0}.bt{font-size:22px;font-weight:bold}.bs{font-size:11px}.bootlog{height:120px;margin-top:18px;white-space:pre-wrap;overflow:hidden}.pb{height:18px;border:2px solid #fff;padding:2px;background:#000}.pb>i{display:block;height:100%;width:0;background:#fff}.skip{display:none;margin-top:10px;text-align:right}
#desktop{position:absolute;inset:0 0 30px 0;padding:8px}.icon{position:absolute;width:78px;text-align:center;color:#fff;text-shadow:1px 1px #000;cursor:default}.icon.sel .label{background:#000080;border:1px dotted #fff}.glyph{font-size:32px;height:38px}.label{display:inline-block;max-width:78px;padding:1px 3px}.window{position:absolute;min-width:220px;min-height:120px;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;box-shadow:1px 1px #000;display:flex;flex-direction:column}.title{height:20px;background:#000080;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:2px 3px;font-weight:bold;cursor:default}.title.inactive{background:#808080}.controls{display:flex;gap:2px}.controls button{width:16px;height:14px;padding:0;line-height:10px}.body{flex:1;min-height:0;overflow:auto}.openanim{animation:open .12s steps(2,end)}@keyframes open{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}.taskbar{position:fixed;bottom:0;left:0;right:0;height:30px;background:#c0c0c0;border-top:1px solid #fff;display:flex;align-items:center;padding:2px;z-index:10000}.start{font-weight:bold;height:24px}.tasks{display:flex;gap:2px;flex:1;overflow:hidden;padding:0 4px}.task{height:24px;min-width:120px;max-width:170px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.task.active{box-shadow:inset 1px 1px #000,inset -1px -1px #fff;background:#e6e6e6}.tray{height:24px;border:2px solid;border-color:#808080 #fff #fff #808080;padding:3px 8px}
#menu{position:fixed;display:none;bottom:30px;left:2px;width:230px;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;z-index:20000;box-shadow:2px 2px #555}#menu.on{display:flex}.side{width:28px;background:linear-gradient(#000080,#1084d0);color:#fff;writing-mode:vertical-rl;transform:rotate(180deg);padding:8px 4px;font-weight:bold}.mi{padding:7px 10px;display:flex;gap:8px;align-items:center}.mi:hover{background:#000080;color:#fff}.sep{height:2px;border-top:1px solid #808080;border-bottom:1px solid #fff;margin:2px}
.menurow{display:flex;align-items:center;border-bottom:1px solid #808080}.menurow button{border:0;background:transparent;padding:3px 8px}.menurow button:hover{background:#000080;color:#fff}
.pad{display:flex;flex-direction:column;height:100%}.editor{flex:1;width:100%;resize:none;border:0;outline:0;padding:5px;font:12px"Courier New",monospace}.status{height:19px;border-top:1px solid #808080;padding:2px 5px;font-size:10px}
.exbar{display:flex;gap:3px;padding:4px;border-bottom:1px solid #808080}.path{flex:1}.explorer{display:flex;height:calc(100% - 50px)}.tree{width:34%;padding:6px;overflow:auto;border-right:1px solid #aaa;background:#fff}.files{flex:1;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,80px);grid-auto-rows:76px;gap:6px;overflow:auto;background:#fff}.f{padding:3px;text-align:center}.f.sel,.f:hover{background:#000080;color:#fff}.fi{font-size:28px}.fm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.calc{padding:8px}.display{background:#fff;border:2px inset #fff;padding:5px;text-align:right;font:16px monospace;margin-bottom:5px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.keys button{height:29px}.chat{display:flex;flex-direction:column;height:100%;padding:5px;gap:5px}.hist{flex:1;overflow:auto;background:#fff;border:2px inset #fff;padding:5px}.msg{max-width:88%;padding:4px;margin:3px 0;border:1px solid #ccc}.msg.u{margin-left:auto;background:#e6f2ff}.chatctl{display:flex;gap:4px}.chatctl textarea{flex:1;height:40px;resize:none}.ctx{position:fixed;display:none;min-width:170px;background:#c0c0c0;border:2px solid;border-color:#fff #000 #000 #fff;z-index:30000}.ctx.on{display:block}.ctx button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:6px}.ctx button:hover{background:#000080;color:#fff}.notice{position:fixed;right:6px;bottom:36px;background:#ffffe1;border:2px solid;border-color:#fff #000 #000 #fff;padding:5px;z-index:25000}.crt:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:15000;background:repeating-linear-gradient(#0000 0 2px,#00000008 2px 3px)}
@media(max-width:700px){.window{max-width:calc(100vw - 8px)}}
</style>
</head>
<body>
<div id="boot"><div class="bootbox"><div class="brand"><div class="logo"><i></i><i></i><i></i><i></i></div><div><div class="bt">Microsoft Windows 98</div><div class="bs">AI Desktop Remaster</div></div></div><div class="bootlog" id="blog"></div><div class="pb"><i id="bar"></i></div><div class="skip"><button id="skip">Skip</button></div></div></div>
<div id="desktop"></div>
<div id="menu"><div class="side">Windows 98</div><div style="flex:1;padding:2px" id="items"></div></div>
<div class="taskbar"><button class="start" id="start">Start</button><div class="tasks" id="tasks"></div><div class="tray"><span id="clock">00:00</span></div></div>
<div class="ctx" id="ctx"></div><div id="notes"></div>
<script>
(()=>{"use strict";
const KEY="w98-remaster-v1";
const S=JSON.parse(localStorage.getItem(KEY)||"{}");
const state=Object.assign({icons:{},notes:"",crt:false,fastBoot:false,sound:true,aiEndpoint:""},S);
const fs=S.fs||{
"C:\\":{t:"d",c:["Windows","Program Files","My Documents","Desktop","Readme.txt","AOL.exe","SYSTEM.INI"]},
"C:\\Windows":{t:"d",c:["WIN.COM","SYSTEM.INI","NOTEPAD.EXE"]},
"C:\\Program Files":{t:"d",c:["AI Buddy"]},
"C:\\Program Files\\AI Buddy":{t:"d",c:["AIBUDDY.EXE"]},
"C:\\My Documents":{t:"d",c:["Notes.txt"]},
"C:\\Desktop":{t:"d",c:["Notes.txt","AOL.exe"]},
"C:\\Readme.txt":{t:"f",x:"Windows 98 AI Desktop Remaster\r\n\r\nA functional browser-based desktop simulation."},
"C:\\AOL.exe":{t:"a",a:"chat"},
"C:\\SYSTEM.INI":{t:"p",x:"[boot]\r\nshell=Explorer.exe\r\n"}
};
state.fs=fs;let wins={},z=20,wid=0,active=null,bootDone=false;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(t){const n=document.createElement("div");n.className="notice";n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),1500)}
function now(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
setInterval(()=>document.getElementById("clock").textContent=now(),1000);document.getElementById("clock").textContent=now();
function showMenu(v){document.getElementById("menu").classList.toggle("on",v)}
function menu(){document.getElementById("items").innerHTML=[
["💬","AI Buddy","chat"],["📝","Notepad","note"],["🧮","Calculator","calc"],["🖥","Windows Explorer","explore"],["","---",""],["⚙","Settings","settings"],["?","About","about"],["","---",""],["⏻","Shut Down...","shutdown"]].map(x=>x[1]==="---"?'<div class="sep"></div>':`<div class="mi" data-a="${x[2]}"><span>${x[0]}</span><span>${x[1]}</span></div>`).join("");
document.querySelectorAll(".mi").forEach(e=>e.onclick=()=>{showMenu(false);const a=e.dataset.a;if(a==="settings")settings();else if(a==="about")dialog("About Windows 98","Windows 98 AI Desktop Remaster");else if(a==="shutdown")shutdown();else open(a)})
} 
function initIcons(){const list=[["computer","🖥","My Computer","explore"],["note","📝","Notes.txt","note"],["chat","💬","AI Buddy","chat"],["calc","🧮","Calc","calc"]];const d=document.getElementById("desktop");d.innerHTML="";list.forEach((x,i)=>{const e=document.createElement("div");e.className="icon";e.dataset.id=x[0];const p=state.icons[x[0]]||{x:8+(i%2)*86,y:8+Math.floor(i/2)*90};e.style.left=p.x+"px";e.style.top=p.y+"px";e.innerHTML=`<div class="glyph">${x[1]}</div><div class="label">${x[2]}</div>`;e.onclick=()=>{document.querySelectorAll(".icon").forEach(i=>i.classList.remove("sel"));e.classList.add("sel")};e.ondblclick=()=>open(x[3]);enableIconDrag(e,x[0]);d.appendChild(e)})}
function enableIconDrag(e,k){let sx,sy,ox,oy,m=false;e.addEventListener("pointerdown",ev=>{if(ev.button!==0)return;sx=ev.clientX;sy=ev.clientY;ox=parseInt(e.style.left)||0;oy=parseInt(e.style.top)||0;const move=x=>{const dx=x.clientX-sx,dy=x.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>4)m=true;if(m){e.style.left=Math.max(0,ox+dx)+"px";e.style.top=Math.max(0,oy+dy)+"px"}};const up=()=>{document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);if(m){state.icons[k]={x:parseInt(e.style.left),y:parseInt(e.style.top)};save()}};document.addEventListener("pointermove",move);document.addEventListener("pointerup",up)})}
function create(title,kind,w,h,render){const id="w"+(++wid),e=document.createElement("div");e.className="window openanim";e.id=id;e.style.width=(w||420)+"px";e.style.height=(h||300)+"px";const top=Math.max(4,60+(Object.keys(wins).length*24)%160),left=Math.max(4,80+(Object.keys(wins).length*28)%220);e.style.top=top+"px";e.style.left=left+"px";e.innerHTML=`<div class="title"><span>${esc(title)}</span><div class="controls"><button data-c="min">_</button><button data-c="max">□</button><button data-c="close">×</button></div></div><div class="body"></div>`;document.body.appendChild(e);const b=e.querySelector(".body");wins[id]={e,title,state:"normal",prev:null,kind};e.querySelector('[data-c="min"]').onclick=()=>min(id);e.querySelector('[data-c="max"]').onclick=()=>max(id);e.querySelector('[data-c="close"]').onclick=()=>close(id);e.addEventListener("pointerdown",()=>focus(id));drag(e,e.querySelector(".title"),id);render(b,id);const t=document.createElement("button");t.className="task active";t.textContent=title;t.id=id+"t";t.onclick=()=>{if(wins[id].state==="min"){wins[id].state="normal";e.style.display="flex"}focus(id)};document.getElementById("tasks").appendChild(t);focus(id);return id}
function focus(id){if(!wins[id])return;Object.values(wins).forEach(w=>w.e.querySelector(".title").classList.add("inactive"));wins[id].e.querySelector(".title").classList.remove("inactive");wins[id].e.style.zIndex=++z;Object.values(wins).forEach(w=>document.getElementById(w.e.id+"t")?.classList.remove("active"));document.getElementById(id+"t")?.classList.add("active");active=id}
function min(id){const w=wins[id];if(!w)return;w.state="min";w.e.style.display="none";document.getElementById(id+"t").classList.remove("active");const n=Object.keys(wins).filter(x=>wins[x].state!=="min");if(n.length)focus(n.at(-1));save()}
function max(id){const w=wins[id];if(!w)return;if(w.state==="max"){w.state="normal";Object.assign(w.e.style,w.prev)}else{w.prev={top:w.e.style.top,left:w.e.style.left,width:w.e.style.width,height:w.e.style.height};w.state="max";w.e.style.top="0";w.e.style.left="0";w.e.style.width="100%";w.e.style.height="calc(100vh - 30px)"}focus(id);save()}
function close(id){const w=wins[id];if(!w)return;w.e.remove();document.getElementById(id+"t")?.remove();delete wins[id];if(active===id){const n=Object.keys(wins).filter(x=>wins[x].state!=="min");if(n.length)focus(n.at(-1));else active=null}}
function drag(e,h,id){let sx,sy,ox,oy,on=false;h.addEventListener("pointerdown",ev=>{if(ev.button!==0||wins[id].state==="max")return;sx=ev.clientX;sy=ev.clientY;ox=parseInt(e.style.left)||0;oy=parseInt(e.style.top)||0;const move=x=>{on=true;e.style.left=Math.max(0,ox+x.clientX-sx)+"px";e.style.top=Math.max(0,oy+x.clientY-sy)+"px"};const up=()=>{document.removeEventListener("pointermove",move);document.removeEventListener("pointerup",up);save()};document.addEventListener("pointermove",move);document.addEventListener("pointerup",up);focus(id)})}
function appMenu(items){return '<div class="menurow">'+items.map(i=>`<button onclick="${i[1]}">${i[0]}</button>`).join("")+"</div>"}
function note(b,id){b.innerHTML='<div class="pad">'+appMenu([["File","noteSave(\''+id+"\')"],["Open","noteOpen('"+id+"')"],["Clear","noteClear('"+id+"')"],["Help","dialog('Notepad Help','Ctrl+S uloží Notes.txt.')"]])+'<textarea class="editor" id="ed_'+id+'"></textarea><div class="status" id="ns_'+id+'">Ready</div></div>';document.getElementById("ed_"+id).value=state.notes||fs["C:\\My Documents\\Notes.txt"].x||"";document.getElementById("ed_"+id).addEventListener("input",()=>{state.notes=document.getElementById("ed_"+id).value;document.getElementById("ns_"+id).textContent="Modified";save()})}
window.noteSave=id=>{const x=document.getElementById("ed_"+id);if(!x)return;state.notes=x.value;fs["C:\\My Documents\\Notes.txt"]={t:"f",x:x.value};fs["C:\\Desktop\\Notes.txt"]={t:"f",x:x.value};save();document.getElementById("ns_"+id).textContent="Saved";toast("Notes.txt saved")};
window.noteOpen=id=>{const x=document.getElementById("ed_"+id);if(x){x.value=fs["C:\\My Documents\\Notes.txt"].x||"";state.notes=x.value;save();}};
window.noteClear=id=>{const x=document.getElementById("ed_"+id);if(x&&confirm("Clear note?")){x.value="";x.dispatchEvent(new Event("input"))}};
function calc(b,id){b.innerHTML='<div class="calc"><div class="display" id="cd_'+id+'">0</div><div class="keys">'+["7","8","9","/","4","5","6","*","1","2","3","-","0",".","C","+","⌫","="].map(k=>`<button onclick="cp('${id}','${k}')">${k}</button>`).join("")+"</div></div>";window.cs=window.cs||{};window.cs[id]={v:"0",e:""}}
window.cp=(id,k)=>{const s=cs[id],d=document.getElementById("cd_"+id);if(k==="C"){s.v="0";s.e=""}else if(k==="⌫"){s.v=s.v.length>1?s.v.slice(0,-1):"0"}else if(k==="="){const r=evalCalc(s.e||s.v);s.v=r==null?"Error":String(r);s.e=""}else if(/[0-9]/.test(k)){s.v=s.v==="0"?k:s.v+k;s.e+=k}else if(k==="."){if(!s.v.includes(".")){s.v+=".";s.e+="."}}else{s.e+=k;s.v=k}d.textContent=s.v};
function evalCalc(x){if(!x||!/^[0-9+\-*/%.\s()]+$/.test(x))return null;try{const t=x.match(/(\d+(?:\.\d+)?|[()+\-*/%])/g),p={"+":1,"-":1,"*":2,"/":2,"%":2},o=[],op=[],st=[];for(const q of t){if(/^\d/.test(q))o.push(+q);else if(q==="(")op.push(q);else if(q===")"){while(op.length&&op.at(-1)!=="(")o.push(op.pop());op.pop()}else{while(op.length&&op.at(-1)!=="("&&p[op.at(-1)]>=p[q])o.push(op.pop());op.push(q)}}while(op.length)o.push(op.pop());for(const q of o)typeof q==="number"?st.push(q):(()=>{const b=st.pop(),a=st.pop();st.push(q==="+"?a+b:q==="-"?a-b:q==="*"?a*b:q==="/" ? a/b:a%b)})();const r=st[0];return Number.isFinite(r)?Math.round(r*1e10)/1e10:null}catch(_){return null}}
function explore(b,id){const p=(state.paths||{})[id]||"C:\\",data=fs[p];b.innerHTML='<div class="exbar"><button onclick="exBack(\''+id+"\')">Back</button><button onclick="exUp('"+id+"')">Up</button><input class="path" id="px_"+id+'" value="'+esc(p)+'"><button onclick="exGo(\''+id+"\')">Go</button></div><div class="explorer"><div class="tree" id="tr_"+id+'"></div><div class="files" id="fl_'+id+'"></div></div><div class="status" id="es_'+id+'"></div>';drawEx(id,p)}
function drawEx(id,p){state.paths=state.paths||{};state.paths[id]=norm(p);const tree=document.getElementById("tr_"+id),files=document.getElementById("fl_"+id);if(!tree||!files)return;const d=fs[state.paths[id]];tree.innerHTML=Object.keys(fs).filter(k=>fs[k].t==="d").map(k=>`<div style="margin:3px;cursor:pointer" onclick="exGoTo('${id}','${k.replace(/'/g,"\\'")}')">📁 ${esc(k)}</div>`).join("");files.innerHTML="";(d?.c||[]).forEach(n=>{const q=join(state.paths[id],n),f=fs[q]||{t:"f"};const e=document.createElement("div");e.className="f";e.innerHTML=`<div class="fi">${f.t==="d"?"📁":f.t==="a"?"💬":"📄"}</div><div class="fm">${esc(n)}</div>`;e.ondblclick=()=>openPath(q,id);e.oncontextmenu=ev=>{ev.preventDefault();ctx(ev.clientX,ev.clientY,[["Open",()=>openPath(q,id)],["Rename",()=>rename(q,id)],["Delete",()=>del(q,id)]]);};files.appendChild(e)})}
function norm(p){p=(p||"C:\\").replace(/\//g,"\\");return p==="C:"?"C:\\":p.replace(/\\+$/,"")||"C:\\"}function join(a,n){return a==="C:\\"?"C:\\"+n:a+"\\"+n.replace(/^\s/,"")}function parent(p){p=norm(p);if(p==="C:\\")return p;const i=p.lastIndexOf("\\");return i<=2?"C:\\":p.slice(0,i)}
window.exGo=id=>{const x=document.getElementById("px_"+id);if(x){state.paths[id]=norm(x.value);drawEx(id,state.paths[id])}};window.exGoTo=(id,p)=>{state.paths[id]=p;drawEx(id,p)};window.exUp=id=>{state.paths[id]=parent(state.paths[id]);drawEx(id,state.paths[id])};window.exBack=id=>{state.paths[id]="C:\\";drawEx(id,state.paths[id])};
function openPath(p,id){const f=fs[p];if(!f)return;if(f.t==="d"){state.paths[id]=p;drawEx(id,p)}else if(f.t==="a")open("chat");else if(f.t==="p")dialog("Access Denied","SYSTEM.INI is protected.");else if(/\.txt$/i.test(p)){const n=open("note");setTimeout(()=>{const x=Object.keys(wins).find(k=>wins[k].kind==="note"&&document.getElementById(k+"t")?.classList.contains("active"));if(x){const ed=wins[x].e.querySelector(".editor");ed.value=f.x||""}},30)}}
function rename(p,id){const n=p.slice(p.lastIndexOf("\\")+1),nn=prompt("New name:",n);if(!nn)return;const pp=parent(p),np=join(pp,nn);if(fs[np])return toast("Name already exists");fs[np]=fs[p];delete fs[p];if(fs[pp]){const i=fs[pp].c.indexOf(n);if(i>=0)fs[pp].c[i]=nn}save();drawEx(id,pp)}
function del(p,id){if(!confirm("Delete item?"))return;const pp=parent(p),n=p.slice(p.lastIndexOf("\\")+1);delete fs[p];if(fs[pp])fs[pp].c=fs[pp].c.filter(x=>x!==n);save();drawEx(id,pp)}
function chat(b,id){b.innerHTML='<div class="chat"><div><b>AIM - SmarterChild</b> <span id="st_'+id+'">Offline demo</span></div><div class="hist" id="h_'+id+'"><div class="msg">SmarterChild: I am ready. Ask a question.</div></div><div class="chatctl"><textarea id="ci_'+id+'"></textarea></div></div>';const ctl=b.querySelector(".chatctl");const btn=document.createElement("button");btn.textContent="Send";btn.addEventListener("click",()=>send(id));ctl.appendChild(btn);document.getElementById("ci_"+id).addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(id)}})}
window.send=async id=>{const i=document.getElementById("ci_"+id),t=i.value.trim(),h=document.getElementById("h_"+id);if(!t)return;h.innerHTML+='<div class="msg u">'+esc(t)+'</div>';i.value="";const p=document.createElement("div");p.className="msg";p.textContent="SmarterChild is typing...";h.appendChild(p);h.scrollTop=h.scrollHeight;let r;if(state.aiEndpoint){try{const q=await fetch(state.aiEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:t})});if(!q.ok)throw Error(q.status);const j=await q.json();r=j.reply||j.text||j.output||"Empty response"}catch(e){r="Connection failed. Offline mode remains available."}}else{await new Promise(x=>setTimeout(x,120));r=localAI(t)}p.textContent="SmarterChild: "+r;h.scrollTop=h.scrollHeight};
function localAI(t){const x=t.toLowerCase();if(x.includes("time")||x.includes("čas"))return"Current browser time: "+now();if(x.includes("notepad"))return"Use Start → Notepad or double-click Notes.txt.";if(x.includes("calculator")||x.includes("kalkul"))return"Calculator supports +, -, *, /, %, decimals and keyboard input.";if(x.includes("explorer")||x.includes("soub"))return"Explorer uses the local virtual filesystem stored in your browser.";if(x.includes("hello")||x.includes("ahoj"))return"Hello from SmarterChild.";return"Offline demo received your message. Configure an AI proxy in Settings for live model responses."}
function settings(){const b=document.createElement("div");b.innerHTML='<div style="padding:8px"><fieldset><legend>Display</legend><label><input id="sc" type="checkbox"> CRT scanlines</label><br><label><input id="sf" type="checkbox"> Fast boot</label></fieldset><fieldset><legend>Sound</legend><label><input id="ss" type="checkbox"> Sound enabled</label></fieldset><fieldset><legend>AI proxy</legend><input id="sa" style="width:100%" placeholder="https://your-server/api/chat"></fieldset><p><button id="saveSet">Apply</button></p></div>';const id=create("Settings","settings",380,290,x=>x.append(b));setTimeout(()=>{document.getElementById("sc").checked=state.crt;document.getElementById("sf").checked=state.fastBoot;document.getElementById("ss").checked=state.sound;document.getElementById("sa").value=state.aiEndpoint||"";document.getElementById("saveSet").onclick=()=>{state.crt=sc.checked;state.fastBoot=sf.checked;state.sound=ss.checked;state.aiEndpoint=sa.value.trim();document.body.classList.toggle("crt",state.crt);save();close(id);toast("Settings saved")}},0)}
function dialog(t,m){const b=document.createElement("div");b.style.padding="12px";b.innerHTML="<p>"+esc(m).replace(/\n/g,"<br>")+"</p><div style='text-align:right'><button id='okd'>OK</button></div>";const id=create(t,"dialog",320,170,x=>x.append(b));setTimeout(()=>document.getElementById("okd").onclick=()=>close(id),0)}
function shutdown(){showMenu(false);const boot=document.getElementById("boot");boot.classList.remove("hide");document.getElementById("blog").textContent="Saving user settings...\nClosing applications...\nStopping virtual devices...\n\nIt is now safe to close this window.";document.getElementById("bar").style.width="100%";document.querySelector(".bt").textContent="Windows 98 is shutting down";document.querySelector(".bs").textContent="It is now safe to close this window."}
function ctx(x,y,items){const c=document.getElementById("ctx");c.innerHTML=items.map((it,i=>`<button data-i="${i}">${it[0]}</button>`)).join("");c.style.left=Math.min(x,innerWidth-180)+"px";c.style.top=Math.min(y,innerHeight-130)+"px";c.classList.add("on");c.querySelectorAll("button").forEach((b,i)=>b.onclick=()=>{c.classList.remove("on");items[i][1]()})}
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#ctx"))document.getElementById("ctx").classList.remove("on");});
document.getElementById("desktop").oncontextmenu=e=>{if(e.target.closest(".icon"))return;e.preventDefault();ctx(e.clientX,e.clientY,[["Refresh",()=>initIcons()],["Arrange Icons",()=>{document.querySelectorAll(".icon").forEach((e,i)=>{e.style.left=(8+(i%2)*86)+"px";e.style.top=(8+Math.floor(i/2)*90)+"px"})}],["Properties",()=>settings()]])};
window.open=(k)=>{if(k==="note")return create("Notepad","note",430,330,note);if(k==="calc")return create("Calculator","calc",280,250,calc);if(k==="chat")return create("AI Buddy","chat",470,360,chat);if(k==="explore")return create("Windows Explorer","explore",620,420,explore)};
document.addEventListener("keydown",e=>{if(e.altKey&&e.key==="F4"&&active){e.preventDefault();close(active)}if(e.altKey&&e.key==="Tab"){e.preventDefault();const a=Object.keys(wins),i=Math.max(0,a.indexOf(active));if(a.length)focus(a[(i+1)%a.length])}if((e.ctrlKey||e.metaKey)&&e.key==="Escape"){e.preventDefault();showMenu(!document.getElementById("menu").classList.contains("on"))}});
document.getElementById("start").onclick=()=>showMenu(!document.getElementById("menu").classList.contains("on"));
document.addEventListener("click",e=>{const m=document.getElementById("menu");if(m.classList.contains("on")&&!e.target.closest("#menu")&&!e.target.closest("#start"))showMenu(false)});
const boot=document.getElementById("boot"),blog=document.getElementById("blog"),bar=document.getElementById("bar");let bi=0;const bs=["Award BIOS 4.51PG","Memory test: 65536K OK","Detecting IDE devices...","Initializing mouse...","Loading virtual filesystem...","Starting Windows 98 AI Desktop...","Loading user environment...","Desktop ready."];document.getElementById("skip").onclick=()=>finish();document.querySelector(".skip").style.display="block";function finish(){boot.classList.add("hide");init();}function step(){if(bi>=bs.length)return finish();blog.textContent+=(blog.textContent?"\n":"")+"> "+bs[bi];bar.style.width=((bi+1)/bs.length*100)+"%";bi++;setTimeout(step,state.fastBoot?5:75)}function init(){if(bootDone)return;bootDone=true;menu();initIcons();document.body.classList.toggle("crt",state.crt);toast("Windows 98 desktop ready");}
if(state.fastBoot)finish();else step();
})();
</script>
